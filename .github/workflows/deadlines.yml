name: Refresh tax deadlines

# Auto-rebuilds data/deadlines.json so the "Φορολογικό Ραντάρ" never goes stale.
on:
  schedule:
    - cron: '0 4 * * *'      # every day at 04:00 UTC
  workflow_dispatch: {}       # allow manual runs
  push:
    paths:
      - 'data/overrides.json'
      - 'scripts/build-deadlines.mjs'
      - '.github/workflows/deadlines.yml'

permissions:
  contents: write

concurrency:
  group: deadlines
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build deadlines.json
        run: node scripts/build-deadlines.mjs
      - name: Commit if changed
        run: |
          if [[ -n "$(git status --porcelain data/deadlines.json)" ]]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/deadlines.json
            git commit -m "chore: refresh tax deadlines [skip ci]"
            git push
          else
            echo "No changes to deadlines.json"
          fi
